<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tendera — робочий простір</title>
<meta name="description" content="Робочий простір Tendera: відкриті тендери з Prozorro і TED, pipeline, заявки й документи компанії.">
<meta name="theme-color" content="#0B1A26">
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:image" content="../brand/og.png">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="../assets/css/fonts.css?v=20261110">
<link rel="stylesheet" href="app.css?v=20261110">
</head>
<body class="booting">
<a class="skip" href="#view">Перейти до змісту</a>
<div class="shell">
  <aside class="side" id="side" aria-label="Бічна панель">
    <a class="side__brand" href="#/" aria-label="Tendera — огляд"><img src="../brand/logo.svg" height="30" alt="Tendera"></a>
    <button class="org" type="button" id="orgBtn" aria-label="Компанія">
      <span class="org__logo" id="orgLogo"></span>
      <span class="org__txt"><b id="orgName"></b><small id="orgPlan"></small></span>
    </button>
    <nav class="side__nav" aria-label="Розділи">
      <a href="#/" data-route="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg>Огляд</a>
      <a href="#/tenders" data-route="tenders"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Тендери<span class="badge" id="newCount" hidden title="Нові підходящі тендери за 24 години"></span></a>
      <a href="#/pipeline" data-route="pipeline"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z"/></svg>Pipeline</a>
      <a href="#/bid" data-route="bid"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/></svg>Заявки</a>
      <a href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="m16 5 3.8-1 3 15.4-3.9.8z" transform="translate(-2 1)"/></svg>Бібліотека</a>
      <a href="#/analytics" data-route="analytics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Аналітика</a>
      <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Налаштування</a>
    </nav>
    <div class="side__card side__me" id="sideMe">
      <div class="me__row"><span class="avatar" id="sideAvatar" aria-hidden="true"></span><span class="me__txt"><b id="sideName"></b><small id="sideRole"></small></span></div>
      <div class="me__plan"><span class="me__label">Підписка</span><b id="sidePlan"></b><span class="chip" id="sideStatus"></span></div>
      <div class="meter__bar" id="sideBar" hidden><i></i></div>
      <small class="me__note" id="sideNote"></small>
      <a class="btn btn--sm btn--ghost" id="sideCta" href="#/settings?tab=billing">Керувати підпискою</a>
    </div>
    <a class="side__back" href="../">← На сайт Tendera</a>
  </aside>

  <div class="main">
    <header class="top">
      <button class="top__menu" id="menuBtn" type="button" aria-label="Меню" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="search" id="searchBtn" type="button" aria-label="Пошук і команди">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <span>Пошук тендерів, замовників, команд</span><kbd>⌘K</kbd>
      </button>
      <div class="top__right">
        <span class="demo-pill" id="freshPill">Дані оновлюються</span>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Перемкнути тему"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="icon-btn" id="bellBtn" type="button" aria-label="Сповіщення" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
        <button class="avatar" id="meBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="mePop" title="Акаунт"></button>
      </div>
      <div class="pop" id="mePop" hidden>
        <div class="pop__me"><span class="avatar" id="meAvatar" aria-hidden="true"></span><span class="pop__meTxt"><b id="meName"></b><span id="meMail"></span></span></div>
        <a href="#/settings?tab=account" class="pop__item"><b>Акаунт</b></a>
        <a href="#/settings?tab=company" class="pop__item"><b>Профіль компанії</b></a>
        <a href="#/settings?tab=team" class="pop__item"><b>Команда</b></a>
        <button type="button" class="pop__item pop__btn" id="signOut"><b>Вийти</b></button>
      </div>
      <div class="pop" id="bellPop" hidden>
        <p class="pop__title">Сповіщення</p>
        <div id="bellList"></div>
      </div>
    </header>
    <div class="plan-banner" id="planBanner" role="status" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Пошук і команди">
  <div class="palette__box">
    <input id="paletteInput" placeholder="Що шукаємо?" autocomplete="off" aria-controls="paletteList">
    <ul id="paletteList" role="listbox"></ul>
    <p class="palette__hint"><kbd>↑</kbd><kbd>↓</kbd> вибір <kbd>Enter</kbd> відкрити <kbd>Esc</kbd> закрити</p>
  </div>
</div>

<div class="onb" id="onb" hidden role="dialog" aria-modal="true" aria-labelledby="onbTitle"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/config.js?v=20261110"></script>
<script src="../assets/js/auth-client.js?v=20261110"></script>
<script src="../assets/js/taxonomy.js?v=20261110"></script>
<script src="../assets/js/europe.js?v=20261110"></script>
<script src="app.js?v=20261110"></script>
</body>
</html>
