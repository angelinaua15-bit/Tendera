name: Оновлення тендерів і деплой сайту

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # щогодини
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Зібрати відкриті тендери (Prozorro, TED, курси НБУ)
        run: node scripts/fetch-tenders.mjs
        continue-on-error: true
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Тримати базу Supabase активною (щоб безкоштовний проєкт не ставився на паузу)
        continue-on-error: true
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" assets/js/config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" assets/js/config.js)
          curl -sS -m 20 -o /dev/null -w "auth health: %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY" || true
          curl -sS -m 20 -o /dev/null -w "db ping: %{http_code}\n" "$URL/rest/v1/organizations?select=id&limit=1" -H "apikey: $KEY" || true
      - name: Підсумок
        run: |
          ls -la data || true
          cat data/meta.json || echo "meta.json не створено"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
